workflows:
  hekaya-apk:
    name: HEKAYA APK
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Prepare Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Download Gradle 9.3.1
        script: |
          wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q gradle-9.3.1-bin.zip

      - name: Create debug keystore
        script: |
          keytool -genkeypair \
            -v \
            -keystore "$CM_BUILD_DIR/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build HEKAYA APK
        script: |
          ./gradle-9.3.1/bin/gradle assembleDebug --no-daemon

    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
