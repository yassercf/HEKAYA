workflows:
  hekaya-apk:
    name: HEKAYA APK
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 17
      vars:
        DEBUG_KEYSTORE_PATH: $CM_BUILD_DIR/debug.keystore

    scripts:
      - name: Prepare Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Create debug keystore
        script: |
          keytool -genkeypair -v \
            -keystore "$DEBUG_KEYSTORE_PATH" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build HEKAYA APK
        script: |
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK is signed
        script: |
          $ANDROID_SDK_ROOT/build-tools/*/apksigner verify --print-certs \
            app/build/outputs/apk/debug/app-debug.apk

    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
