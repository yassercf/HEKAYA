workflows:
  hekaya-apk:
    name: HEKAYA APK
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      java: 17
      vars:
        DEBUG_KEYSTORE_PATH: $CM_BUILD_DIR/debug.keystore

    scripts:
      - name: Prepare Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Create debug keystore
        script: |
          keytool -genkeypair -v \
            -keystore "$DEBUG_KEYSTORE_PATH" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Download Gradle 9.3.1
        script: |
          set -e
          cd "$CM_BUILD_DIR"
          curl -f -sSL -o gradle.zip https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q gradle.zip
          ls -la "$CM_BUILD_DIR"
          ls -la "$CM_BUILD_DIR/gradle-9.3.1/bin"

      - name: Build HEKAYA APK
        script: |
          set -e
          "$CM_BUILD_DIR/gradle-9.3.1/bin/gradle" assembleDebug --no-daemon

      - name: Verify APK is signed
        script: |
          LATEST_BUILD_TOOLS=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/*/ | sort -V | tail -1)
          "${LATEST_BUILD_TOOLS}apksigner" verify --print-certs \
          app/build/outputs/apk/debug/app-debug.apk


    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
